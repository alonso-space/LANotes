services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lanotes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
      POSTGRES_DB: ${DB_DATABASE:-lanotes_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  lanotes:
    image: lanotes:1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lanotes}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
      DB_DATABASE: ${DB_DATABASE:-lanotes_db}
      APP_PORT: ${APP_PORT:-3000}
      GUEST_REGISTER: ${GUEST_REGISTER:-true}
      SESSION_SECRET: ${SESSION_SECRET:-}
      HOST_IP: ${HOST_IP:-}
      OWNER_USER: ${OWNER_USER:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - lanotesdata:/app/server/data
      - lanotescerts:/app/server/certs

volumes:
  pgdata:
  lanotesdata:
  lanotescerts:
